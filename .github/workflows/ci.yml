name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  compatibility:
    name: Compatibility (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Configure runner-local paths
        shell: pwsh
        run: |
          $coreDirectory = Join-Path $env:RUNNER_TEMP "core"
          New-Item -ItemType Directory -Force -Path $coreDirectory | Out-Null
          $coreWheel = Join-Path $coreDirectory "pds_core-0.6.3-py3-none-any.whl"
          "PDS_CORE_WHEEL=$coreWheel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download official Core release wheel
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-core/releases/download/v0.6.3/pds_core-0.6.3-py3-none-any.whl" `
            -OutFile $env:PDS_CORE_WHEEL `
            -ErrorAction Stop
          if (-not (Test-Path -LiteralPath $env:PDS_CORE_WHEEL -PathType Leaf)) {
            throw "Core wheel download did not create $env:PDS_CORE_WHEEL."
          }

      - name: Authenticate and install Core
        shell: pwsh
        run: |
          python scripts/verify_core_wheel.py "$env:PDS_CORE_WHEEL"
          python -m pip install "$env:PDS_CORE_WHEEL"

      - name: Install Vitrine development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Remove editable-install residue
        shell: pwsh
        run: |
          @("build", "dist", "pds_vitrine.egg-info") | ForEach-Object {
            if (Test-Path -LiteralPath $_) {
              Remove-Item -Recurse -Force -LiteralPath $_
            }
          }

      - name: Verify installed Core
        run: python scripts/verify_core_wheel.py --installed

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run runtime compatibility tests
        run: python -m pytest

      - name: Verify no whitespace errors
        run: git diff --check

  qualification:
    name: Complete qualification (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Configure runner-local paths
        shell: pwsh
        run: |
          $coreDirectory = Join-Path $env:RUNNER_TEMP "core"
          New-Item -ItemType Directory -Force -Path $coreDirectory | Out-Null
          $coreWheel = Join-Path $coreDirectory "pds_core-0.6.3-py3-none-any.whl"
          "PDS_CORE_WHEEL=$coreWheel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download official Core release wheel
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-core/releases/download/v0.6.3/pds_core-0.6.3-py3-none-any.whl" `
            -OutFile $env:PDS_CORE_WHEEL `
            -ErrorAction Stop
          if (-not (Test-Path -LiteralPath $env:PDS_CORE_WHEEL -PathType Leaf)) {
            throw "Core wheel download did not create $env:PDS_CORE_WHEEL."
          }

      - name: Authenticate and install Core
        shell: pwsh
        run: |
          python scripts/verify_core_wheel.py "$env:PDS_CORE_WHEEL"
          python -m pip install "$env:PDS_CORE_WHEEL"

      - name: Install Vitrine development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Remove editable-install residue
        shell: pwsh
        run: |
          @("build", "dist", "pds_vitrine.egg-info") | ForEach-Object {
            if (Test-Path -LiteralPath $_) {
              Remove-Item -Recurse -Force -LiteralPath $_
            }
          }

      - name: Run complete repository validation
        shell: pwsh
        run: python scripts/validate_repository.py --core-wheel "$env:PDS_CORE_WHEEL"

  live_installed_acceptance:
    name: Live producer installed acceptance (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Configure issue #71 artifact paths
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $env:RUNNER_TEMP "issue71-release-wheels"
          $wheelhouse = Join-Path $env:RUNNER_TEMP "issue71-wheelhouse"
          $vitrineDist = Join-Path $env:RUNNER_TEMP "issue71-vitrine-dist"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          New-Item -ItemType Directory -Force -Path $wheelhouse | Out-Null
          New-Item -ItemType Directory -Force -Path $vitrineDist | Out-Null

          "ISSUE71_RELEASE_DIR=$releaseDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ISSUE71_WHEELHOUSE=$wheelhouse" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ISSUE71_VITRINE_DIST=$vitrineDist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ISSUE71_CORE_WHEEL=$(Join-Path $releaseDirectory 'pds_core-0.6.3-py3-none-any.whl')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ISSUE71_SCOREFORM_WHEEL=$(Join-Path $releaseDirectory 'scoreform-0.11.0-py3-none-any.whl')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ISSUE71_QUILLAN_WHEEL=$(Join-Path $releaseDirectory 'quillan-0.10.0-py3-none-any.whl')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ISSUE71_CONCORD_WHEEL=$(Join-Path $releaseDirectory 'pds_concord-0.3.0-py3-none-any.whl')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download exact released PDS wheels
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-core/releases/download/v0.6.3/pds_core-0.6.3-py3-none-any.whl" `
            -OutFile $env:ISSUE71_CORE_WHEEL `
            -ErrorAction Stop
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-scoreform/releases/download/v0.11.0/scoreform-0.11.0-py3-none-any.whl" `
            -OutFile $env:ISSUE71_SCOREFORM_WHEEL `
            -ErrorAction Stop
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-quillan/releases/download/v0.10.0/quillan-0.10.0-py3-none-any.whl" `
            -OutFile $env:ISSUE71_QUILLAN_WHEEL `
            -ErrorAction Stop
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-concord/releases/download/v0.3.0/pds_concord-0.3.0-py3-none-any.whl" `
            -OutFile $env:ISSUE71_CONCORD_WHEEL `
            -ErrorAction Stop

      - name: Prepare endpoint-local offline wheelhouse
        shell: pwsh
        run: |
          python -m pip wheel `
            --wheel-dir "$env:ISSUE71_WHEELHOUSE" `
            --find-links "$env:ISSUE71_RELEASE_DIR" `
            "$env:ISSUE71_CORE_WHEEL" `
            "$env:ISSUE71_SCOREFORM_WHEEL" `
            "$env:ISSUE71_QUILLAN_WHEEL" `
            "$env:ISSUE71_CONCORD_WHEEL"

      - name: Build candidate Vitrine wheel
        shell: pwsh
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$env:ISSUE71_VITRINE_DIST"
          $wheels = @(Get-ChildItem -LiteralPath "$env:ISSUE71_VITRINE_DIST" -Filter "pds_vitrine-0.3.0-*.whl")
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one pds-vitrine 0.3.0 wheel."
          }
          "ISSUE71_VITRINE_WHEEL=$($wheels[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run authoritative issue #71 live installed acceptance
        shell: pwsh
        run: |
          python scripts/qualify_installed_live_portfolio.py `
            --vitrine-wheel "$env:ISSUE71_VITRINE_WHEEL" `
            --wheel-dir "$env:ISSUE71_WHEELHOUSE"
